name: milestone-04-multihoming
topology:
  nodes:
    enterprise-lan1:
      kind: linux
      image: quay.io/frrouting/frr:10.5.4
      binds:
        - configs/enterprise-lan1/daemons:/etc/frr/daemons
        - configs/enterprise-lan1/frr.conf:/etc/frr/frr.conf
      cap-add:
        - NET_ADMIN
      exec:
        - ip route del default via 172.20.20.1 dev eth0
    enterprise-r1:
      kind: linux
      image: quay.io/frrouting/frr:10.5.4
      binds:
        - configs/enterprise-r1/daemons:/etc/frr/daemons
        - configs/enterprise-r1/frr.conf:/etc/frr/frr.conf
      cap-add:
        - NET_ADMIN
      exec:
        - ip link add loopback0 type dummy
        - ip link set loopback0 up
        - ip route del default via 172.20.20.1 dev eth0
    enterprise-r2:
      kind: linux
      image: quay.io/frrouting/frr:10.5.4
      binds:
        - configs/enterprise-r2/daemons:/etc/frr/daemons
        - configs/enterprise-r2/frr.conf:/etc/frr/frr.conf
      cap-add:
        - NET_ADMIN
      exec:
        - ip link add loopback0 type dummy
        - ip link set loopback0 up
        - ip route del default via 172.20.20.1 dev eth0
    isp-r1:
      kind: linux
      image: quay.io/frrouting/frr:10.5.4
      binds:
        - configs/isp-r1/daemons:/etc/frr/daemons
        - configs/isp-r1/frr.conf:/etc/frr/frr.conf
      exec:
        - ip link add loopback0 type dummy
        - ip link set loopback0 up
        - ip route del default via 172.20.20.1 dev eth0
    isp-r2:
      kind: linux
      image: quay.io/frrouting/frr:10.5.4
      binds:
        - configs/isp-r2/daemons:/etc/frr/daemons
        - configs/isp-r2/frr.conf:/etc/frr/frr.conf
      exec:
        - ip link add loopback0 type dummy
        - ip link set loopback0 up
        - ip route del default via 172.20.20.1 dev eth0
    host1:
      kind: linux
      image: alpine:latest
      exec:
        - ip route del default via 172.20.20.1 dev eth0
        - ip addr add 10.10.0.2/24 dev eth1
        - ip route add default via 10.10.0.1
  links:
    - endpoints: [ "enterprise-r1:eth1", "isp-r1:eth1" ]
    - endpoints: [ "enterprise-r1:eth2", "enterprise-r2:eth1" ]
    - endpoints: [ "enterprise-r2:eth2", "enterprise-lan1:eth1" ]
    - endpoints: [ "enterprise-lan1:eth2", "host1:eth1" ]
    - endpoints: [ "enterprise-r1:eth3", "isp-r2:eth1" ]
