frr version 10.5.4_git
frr defaults traditional
hostname enterprise-r1
!
ip prefix-list PERMIT-ALL seq 5 permit 0.0.0.0/0 le 32
ip prefix-list ALLOWED-REDIST seq 5 permit 10.10.0.0/24
!
route-map REDISTRIBUTE-LAN permit 10
 match ip address prefix-list ALLOWED-REDIST
exit
!
interface eth1
 ip address 192.168.12.1/30
exit
!
interface eth2
 ip address 10.20.0.1/30
exit
!
interface eth3
 ip address 192.168.13.1/30
exit
!
interface loopback0
 ip address 10.0.0.1/32
exit
!
route-map SET-LP-PRIMARY permit 10
 set local-preference 200
exit
!
route-map SET-LP-BACKUP permit 10
 set local-preference 100
exit
!
router bgp 65001
 neighbor 192.168.12.2 remote-as 65002
 neighbor 192.168.13.2 remote-as 65003
 neighbor 10.0.0.2 remote-as 65001
 neighbor 10.0.0.2 update-source loopback0
 !
 address-family ipv4 unicast
  redistribute ospf route-map REDISTRIBUTE-LAN
  neighbor 192.168.12.2 prefix-list PERMIT-ALL in
  neighbor 192.168.12.2 prefix-list PERMIT-ALL out
  neighbor 192.168.12.2 route-map SET-LP-PRIMARY in
  neighbor 192.168.13.2 prefix-list PERMIT-ALL in
  neighbor 192.168.13.2 prefix-list PERMIT-ALL out
  neighbor 192.168.13.2 route-map SET-LP-BACKUP in
 exit-address-family
exit
!
router ospf
 network 10.20.0.0/30 area 0
 network 10.0.0.1/32 area 0
 default-information originate always
exit
!